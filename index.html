<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Online Quiz</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

<section id="home" class="card hero">
  <div class="ico">🎓</div>
  <h1>Online Quiz</h1>
  <p>Welcome! Test your knowledge of C programming. Separate questions for Class 9 and Class 10.</p>
  <div class="feat"><span>⏱ Timer</span><span>✅ Auto Marks</span><span>📱 Mobile Friendly</span></div>
  <button onclick="show('details')">Start Quiz →</button>
</section>

<section id="details" class="card hide">
  <h2>Student Details</h2>
  <label for="name">Name</label><input id="name" placeholder="Enter your name" autocomplete="name">
  <label for="cls">Class</label>
  <select id="cls"><option value="">-- Select class --</option><option value="9">Class 9</option><option value="10">Class 10</option></select>
  <label for="roll">Roll Number</label><input id="roll" inputmode="numeric" placeholder="Roll number">
  <div class="err" id="err1"></div>
  <div class="row"><button class="sec" onclick="show('home')">← Back</button><button onclick="toSubject()">Next →</button></div>
</section>

<section id="subject" class="card hide">
  <h2>Subject Selection</h2>
  <div class="sub"><div class="ico">💻</div><div><b>Computer (C Language)</b><br><span style="color:var(--muted)" id="subInfo"></span></div></div>
  <div class="row"><button class="sec" onclick="show('details')">← Back</button><button onclick="startQuiz()">Begin Quiz →</button></div>
</section>

<section id="quiz" class="card hide">
  <div class="top"><b id="who"></b><span class="timer" id="timer">05:00</span></div>
  <div class="bar"><i id="prog"></i></div>
  <p id="qno" style="margin:0 0 6px"></p>
  <p class="q" id="qtext"></p>
  <div id="opts"></div>
  <div class="dots" id="dots"></div>
  <div class="row"><button class="sec" id="prev" onclick="go(-1)">← Previous</button><button id="next" onclick="go(1)">Next →</button></div>
</section>

<section id="result" class="card hide score">
  <h2>Result</h2>
  <p id="rname"></p>
  <div class="big" id="pct"></div>
  <p id="msg"></p>
  <div class="stats">
    <div class="stat"><b id="sc"></b>Score</div>
    <div class="stat"><b class="ok" id="rc"></b>Correct</div>
    <div class="stat"><b class="bad" id="rw"></b>Wrong</div>
    <div class="stat"><b id="ru"></b>Skipped</div>
  </div>
  <div id="review"></div>
  <div class="row"><button onclick="restart()">🔄 Restart Quiz</button></div>
</section>

</div>
<script src="script.js"></script>
</body>
</html>
